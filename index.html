<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actieplan Managementletter 2025 · Monitoring</title>
<meta name="description" content="Voortgangsbewaking opvolging bevindingen accountant — Concern voor Werk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Concern voor Werk huisstijl */
    --accent:#d92b4a;          /* rood / crimson */
    --navy:#1f2d53;            /* donkerblauw primair */
    --navy-deep:#032959;       /* logo blauw */
    --bg:#f2f4f7;
    --ink:#1f2d53;
    --muted:#5a6473;
    --line:#dde1e8;
    --header:#1f2d53;
    --header-accent:#d92b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Open Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:rgba(217,43,74,.15);}
  input,button,select,textarea{font-family:inherit;}
  a{color:var(--accent);}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* Header */
  header.top{background:var(--header);color:#fff;padding:20px 0 0;}
  .head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:22px;}
  .kicker{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--header-accent);text-transform:uppercase;margin-bottom:10px;}
  h1.title{margin:0;font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.08;color:#fff;font-family:'Barlow Condensed','Open Sans',sans-serif;text-transform:uppercase;}
  .subtitle{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.65);font-weight:500;}
  .head-right{display:flex;align-items:center;gap:16px;}
  .peil-label{font-size:11.5px;letter-spacing:.12em;font-weight:700;color:var(--header-accent);text-transform:uppercase;}
  .peil-value{font-size:15px;font-weight:700;color:#fff;margin-top:3px;}
  .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ring-inner{width:48px;height:48px;border-radius:50%;background:var(--header);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-size:16px;font-weight:800;color:#fff;line-height:1;font-family:'Barlow Condensed',sans-serif;}
  .ring-cap{font-size:8px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.08em;margin-top:2px;}

  main{padding:24px 0 72px;}

  /* Banners */
  .banner{border-radius:8px;padding:11px 15px;font-size:13px;font-weight:500;margin-bottom:18px;}
  .banner-warn{background:#fdeaed;border:1px solid #f5b8c4;color:#8b1729;}
  .banner-edit{background:#edf0f7;border:1px solid #c3cade;color:var(--navy);display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;}
  .banner-edit b{font-weight:700;}
  .banner-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px 17px;border-top:3px solid var(--navy);cursor:pointer;transition:box-shadow .15s,transform .1s;}
  .tile:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-1px);}
  .tile.active{outline:2px solid var(--accent);outline-offset:2px;}
  .tile-num{font-size:32px;font-weight:800;line-height:1;font-family:'Barlow Condensed','Open Sans',sans-serif;}
  .tile-lbl{font-size:12px;font-weight:600;color:var(--muted);margin-top:7px;text-transform:uppercase;letter-spacing:.04em;}

  /* Progress */
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;}
  .progress-card{padding:16px 18px;margin-bottom:16px;}
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap;}
  .progress-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);}
  .progress-sub{font-size:13px;font-weight:500;color:var(--muted);}
  .bar{height:8px;background:#e8eaef;border-radius:2px;overflow:hidden;display:flex;}
  .bar > div{height:100%;transition:width .3s;}

  /* Toolbar */
  .toolbar{padding:13px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
  .toolbar input[type=text]{flex:1 1 220px;min-width:180px;padding:9px 13px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;color:var(--ink);outline:none;background:#fff;}
  .toolbar input[type=text]:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,45,83,.12);}
  .filter-group{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .filter-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px;}
  .chip{padding:5px 11px;border-radius:3px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);}
  .chip.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  .chip:hover:not(.on){border-color:var(--navy);color:var(--navy);}
  .toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:4px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;cursor:pointer;outline:none;}
  .btn{padding:8px 13px;border:1px solid var(--line);border-radius:4px;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;cursor:pointer;}
  .btn:hover{border-color:var(--navy);color:var(--navy);}
  .btn-accent{border-color:var(--accent);background:var(--accent);color:#fff;}
  .btn-accent:hover{filter:brightness(1.07);background:var(--accent);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:4px;}

  .result-line{font-size:12px;font-weight:600;color:var(--muted);margin:0 2px 12px;text-transform:uppercase;letter-spacing:.05em;}
  /* rode kicker-lijn onder header-kicker (CvW stijl) */
  .kicker-line{display:block;width:32px;height:3px;background:var(--accent);margin-top:10px;border-radius:1px;}

  /* Group label */
  .group-head{display:flex;align-items:center;gap:10px;margin:22px 2px 12px;}
  .group-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-family:'Barlow Condensed','Open Sans',sans-serif;}
  .group-count{font-size:11px;font-weight:700;color:var(--muted);}
  .group-rule{flex:1;height:1px;background:var(--line);}

  /* Cards */
  article.item{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:10px;}
  .item-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
  .item-main{flex:1 1 360px;min-width:240px;}
  .item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .item-id{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.08em;font-family:'Barlow Condensed','Open Sans',sans-serif;}
  .badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:2px 8px;}
  .tag{font-size:10.5px;font-weight:700;color:var(--navy);background:#e8eaef;border-radius:2px;padding:2px 8px;}
  .src{font-size:11px;font-weight:600;color:var(--muted);}
  h3.item-title{margin:0 0 8px;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--navy);}
  .item-sub{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .owner{font-weight:500;}
  .deadline{display:inline-flex;align-items:center;gap:6px;}
  .deadline b{font-weight:600;color:var(--navy);}
  .note{font-size:10.5px;font-weight:700;border-radius:2px;padding:2px 7px;white-space:nowrap;}

  .item-aside{display:flex;flex-direction:column;align-items:stretch;gap:9px;flex:0 0 290px;min-width:240px;}
  .status-pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border-radius:3px;font-size:12.5px;font-weight:700;}
  .status-pill .dot{width:8px;height:8px;border-radius:50%;}
  .seg{display:flex;gap:5px;}
  .seg button{flex:1 1 0;padding:7px 4px;font-size:11.5px;border-radius:3px;cursor:pointer;text-align:center;white-space:nowrap;line-height:1.1;border:1px solid var(--line);background:#f6f7fa;color:var(--muted);font-weight:600;}
  .toggle{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:#f6f7fa;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .toggle:hover{border-color:var(--navy);color:var(--navy);}
  .toggle .note-badge{font-size:10.5px;font-weight:700;border-radius:2px;padding:2px 8px;}

  .details{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 24px;}
  .detail-lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .detail-val{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .span-all{grid-column:1/-1;}
  .progress-note{margin-top:16px;background:#f6f7fa;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:13px 15px;}
  .progress-note textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:13px;color:var(--ink);resize:vertical;outline:none;background:#fff;font-family:inherit;}
  .progress-note textarea:focus{border-color:var(--navy);}
  .note-meta{font-size:11px;color:var(--muted);margin-top:6px;}

  /* Documenten / SharePoint-links */
  .docs{margin-top:16px;}
  .doc-list{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
  .doc-row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:3px;padding:8px 11px;}
  .doc-link{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:var(--navy);font-weight:600;font-size:13px;}
  .doc-link:hover{color:var(--accent);}
  .doc-link--dead{color:var(--muted);cursor:default;}
  .doc-ico{flex:0 0 auto;color:var(--accent);}
  .doc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-open{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.02em;}
  .doc-open--dead{color:var(--muted);}
  .doc-remove{flex:0 0 auto;width:26px;height:26px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--accent);font-size:16px;line-height:1;cursor:pointer;}
  .doc-remove:hover{border-color:var(--accent);background:#fdeaed;}
  .doc-empty{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .doc-add{margin-top:10px;}
  .doc-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:640px;}

  footer.foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;}
  footer.foot a{color:var(--muted);}
  footer.foot::before{content:'';display:block;width:40px;height:3px;background:var(--accent);margin:0 auto 12px;border-radius:1px;}

  @media (max-width:560px){
    .wrap{padding:0 16px;}
    h1.title{font-size:22px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- config & constants ---------- */
  var CFG = window.MONITOR_CONFIG || {};
  var ACCENT = CFG.accent || "#d92b4a";
  var NAVY  = "#1f2d53";
  document.documentElement.style.setProperty("--accent", ACCENT);

  var STATUS = {
    "Open":      { label:"Niet gestart", txt:"#5a6473", bg:"#edf0f7", stripe:"#b0b9cc", bar:"#b0b9cc" },
    "Opgestart": { label:"Opgestart",    txt:"#8a4a00", bg:"#fef3e2", stripe:"#e8a020", bar:"#e8a020" },
    "Afgerond":  { label:"Afgerond",     txt:"#155e2e", bg:"#e3f3e9", stripe:"#2e9e5a", bar:"#2e9e5a" }
  };
  var STATUS_ORDER = ["Open","Opgestart","Afgerond"];
  var PRIO = {
    "Hoog":   { txt:"#fff",    bg:"#d92b4a" },
    "Middel": { txt:"#1f2d53", bg:"#e8eaef" },
    "Laag":   { txt:"#5a6473", bg:"#f2f4f7" }
  };
  var FIELD_ORDER = ["id","thema","entiteit","prioriteit","bron","owner","deadline","status","bijgewerkt","notitie","links","bevinding","risico","actie","eersteStap","kpi"];
  var DRAFT_KEY = "cvw-actieplan-draft-v1";
  var MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

  var BASE = (window.ACTIES || []).map(function(d){ return Object.assign({}, d); });

  /* ---------- draft (local, unsaved edits) ---------- */
  function loadDraft(){
    try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; }catch(e){ return {}; }
  }
  function saveDraft(d){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }catch(e){}
  }

  /* ---------- state ---------- */
  var state = {
    search:"", statusFilter:"alle", overdueFilter:false, prioFilter:"alle",
    sort:"deadline", groupBy:"geen",
    expanded:{}, allOpen:false,
    edit:false,
    draft: loadDraft()
  };

  /* records merged with draft overrides */
  function records(){
    return BASE.map(function(d){
      var ov = state.draft[d.id] || {};
      return Object.assign({}, d, ov);
    });
  }
  function draftCount(){ return Object.keys(state.draft).length; }

  /* ---------- helpers ---------- */
  function todayISO(){
    var t = new Date();
    return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  }
  function fmtDate(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m ? (m[3]+"-"+m[2]+"-"+m[1]) : (iso||""); }
  function fmtDateLong(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m ? (Number(m[3])+" "+MONTHS[Number(m[2])-1]+" "+m[1]) : (iso||"—"); }

  /* hyperscript: h(tag, attrs, children) — text via string children, safe (no innerHTML) */
  function h(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for(var k in attrs){
      var v = attrs[k];
      if(v==null || v===false) continue;
      if(k==="style" && typeof v==="object"){ for(var s in v) node.style[s]=v[s]; }
      else if(k==="class") node.className = v;
      else if(k.slice(0,2)==="on" && typeof v==="function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if(k==="html") node.innerHTML = v;            /* only used for trusted static strings */
      else node.setAttribute(k, v);
    }
    appendKids(node, children);
    return node;
  }
  function appendKids(node, children){
    if(children==null) return;
    if(Array.isArray(children)){ children.forEach(function(c){ appendKids(node,c); }); return; }
    if(children instanceof Node){ node.appendChild(children); return; }
    node.appendChild(document.createTextNode(String(children)));
  }

  /* ---------- deadline computation ---------- */
  function deadlineInfo(rec, status, today){
    var label = fmtDate(rec.deadline), note="", overdue=false, color="#9aa3a9", bg="transparent";
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(rec.deadline||"");
    if(m && status!=="Afgerond"){
      var dd = new Date(rec.deadline+"T00:00:00");
      var days = Math.round((dd-today)/86400000);
      if(days<0){ note=(-days)+" d. te laat"; color="#b42318"; bg="#fdecea"; overdue=true; }
      else if(days<=45){ note="nog "+days+" d."; color="#a8620a"; bg="#fbf0df"; }
      else { note="nog "+days+" d."; color="#7a858d"; bg="#f0f2f3"; }
    } else if(status==="Afgerond"){
      note="gereed"; color="#15803d"; bg="#e3f3e9";
    } else if(!m){
      label = rec.deadline || "—";
    }
    return { label:label, note:note, overdue:overdue, color:color, bg:bg };
  }

  /* ---------- actions ---------- */
  function setStatus(id, status){
    var ov = Object.assign({}, state.draft[id] || {});
    ov.status = status;
    ov.bijgewerkt = todayISO();
    state.draft[id] = ov;
    saveDraft(state.draft); render();
  }
  function setNote(id, value){
    var ov = Object.assign({}, state.draft[id] || {});
    ov.notitie = value;
    ov.bijgewerkt = todayISO();
    state.draft[id] = ov;
    saveDraft(state.draft); /* no re-render: keep textarea focus */
  }
  function linksOf(rec){ return Array.isArray(rec.links) ? rec.links : []; }
  function safeUrl(u){
    u = String(u || "").trim();
    return /^https?:\/\//i.test(u) ? u : "";   /* alleen http(s) klikbaar */
  }
  function addLink(id, base){
    var label = (window.prompt("Naam van het document:") || "").trim();
    if(!label) return;
    var url = (window.prompt("SharePoint- of weblink (https://…):") || "").trim();
    if(!safeUrl(url)){ if(url) alert("Gebruik een geldige https://-link."); return; }
    var ov = Object.assign({}, state.draft[id] || {});
    var list = (ov.links ? ov.links : linksOf(base)).slice();
    list.push({ label:label, url:url });
    ov.links = list; ov.bijgewerkt = todayISO();
    state.draft[id] = ov; saveDraft(state.draft); render();
  }
  function removeLink(id, base, idx){
    var ov = Object.assign({}, state.draft[id] || {});
    var list = (ov.links ? ov.links : linksOf(base)).slice();
    list.splice(idx, 1);
    ov.links = list; ov.bijgewerkt = todayISO();
    state.draft[id] = ov; saveDraft(state.draft); render();
  }
  function toggleExpand(id){ state.expanded[id] = !state.expanded[id]; render(); }
  function toggleAll(){
    state.allOpen = !state.allOpen;
    var e = {}; BASE.forEach(function(d){ e[d.id]=state.allOpen; });
    state.expanded = e; render();
  }
  function resetDraft(){
    if(!confirm("Lokale wijzigingen wissen en terug naar de gepubliceerde status?")) return;
    state.draft = {}; saveDraft(state.draft); render();
  }

  /* ---------- export data.js ---------- */
  function buildDataFile(){
    var recs = records();
    var items = recs.map(function(r){
      var o = {};
      FIELD_ORDER.forEach(function(k){
        if(k==="links") o[k] = Array.isArray(r.links) ? r.links : [];
        else if(k==="notitie"||k==="bijgewerkt") o[k] = r[k]||"";
        else o[k] = r[k];
      });
      return o;
    });
    var header =
      "/*\n" +
      " * Actieplan Managementletter 2025 — Concern voor Werk\n" +
      " * ----------------------------------------------------------------------------\n" +
      " * DIT BESTAND IS DE GEDEELDE BRON VAN WAARHEID voor het monitoring-dashboard.\n" +
      " *\n" +
      " * Status bijwerken kan op twee manieren:\n" +
      " *   1) Open het dashboard, klik op “Bewerken”, pas status/notities/documenten aan\n" +
      " *      en klik op “Exporteer data.js”. Vervang dit bestand door de download en commit.\n" +
      " *   2) Pas hieronder handmatig de velden “status”, “notitie”, “bijgewerkt” of “links” aan.\n" +
      " *\n" +
      " * Toegestane status-waarden: “Open” (= Niet gestart), “Opgestart”, “Afgerond”.\n" +
      " * Datums in formaat JJJJ-MM-DD.\n" +
      " *\n" +
      " * “links” = gekoppelde documenten (bv. op SharePoint). Elk item:\n" +
      " *      { \"label\": \"Naam document\", \"url\": \"https://...sharepoint.com/...\" }\n" +
      " * De link staat in het publieke dashboard; het bestand blijft achter de SharePoint-\n" +
      " * rechten van jullie team. Alleen http(s)-links worden klikbaar gemaakt.\n" +
      " */\n\n";
    var cfg = "window.MONITOR_CONFIG = " + JSON.stringify({
      title: CFG.title, subtitle: CFG.subtitle, kicker: CFG.kicker,
      peildatum: CFG.peildatum, accent: CFG.accent
    }, null, 2) + ";\n\n";
    var body = "window.ACTIES = " + JSON.stringify(items, null, 2) + ";\n";
    return header + cfg + body;
  }
  function exportData(){
    var blob = new Blob([buildDataFile()], { type:"text/javascript" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "data.js";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  /* ---------- rendering ---------- */
  function chip(label, active, onClick){
    return h("button", { class:"chip"+(active?" on":""), onclick:onClick }, label);
  }

  function render(){
    var peil = CFG.peildatum || todayISO();
    var today = new Date(peil+"T00:00:00");
    var recs = records();

    /* enrich */
    recs = recs.map(function(r){
      var status = STATUS[r.status] ? r.status : "Open";
      var di = deadlineInfo(r, status, today);
      return Object.assign({}, r, { _status:status, _dl:di });
    });

    /* stats */
    var total = recs.length;
    var cOpen = recs.filter(function(r){return r._status==="Open";}).length;
    var cStart = recs.filter(function(r){return r._status==="Opgestart";}).length;
    var cDone = recs.filter(function(r){return r._status==="Afgerond";}).length;
    var overdue = recs.filter(function(r){return r._dl.overdue;}).length;
    var hoogOpen = recs.filter(function(r){return r.prioriteit==="Hoog" && r._status!=="Afgerond";}).length;
    var pct = total ? Math.round(cDone/total*100) : 0;
    var startPct = total ? Math.round(cStart/total*100) : 0;

    /* filter */
    var q = state.search.trim().toLowerCase();
    var filtered = recs.filter(function(r){
      if(state.overdueFilter && !r._dl.overdue) return false;
      if(!state.overdueFilter && state.statusFilter!=="alle" && r._status!==state.statusFilter) return false;
      if(state.prioFilter!=="alle" && r.prioriteit!==state.prioFilter) return false;
      if(q){
        var hay = (r.id+" "+r.thema+" "+r.owner+" "+r.bevinding+" "+r.actie+" "+r.bron+" "+r.entiteit+" "+(r.notitie||"")).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });

    /* sort */
    var prioRank={Hoog:0,Middel:1,Laag:2}, statusRank={Open:0,Opgestart:1,Afgerond:2};
    function dlVal(r){ var m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(r._dl.label); return m?Number(m[3]+m[2]+m[1]):99999999; }
    var sorters = {
      deadline:function(a,b){ return dlVal(a)-dlVal(b) || a.id.localeCompare(b.id); },
      prioriteit:function(a,b){ return prioRank[a.prioriteit]-prioRank[b.prioriteit] || dlVal(a)-dlVal(b); },
      status:function(a,b){ return statusRank[a._status]-statusRank[b._status] || dlVal(a)-dlVal(b); },
      id:function(a,b){ return a.id.localeCompare(b.id); }
    };
    filtered = filtered.slice().sort(sorters[state.sort]||sorters.deadline);

    /* group */
    var groups;
    if(state.groupBy==="geen"){
      groups = [{ key:"all", label:"", count:filtered.length, items:filtered }];
    } else {
      var labelFn = state.groupBy==="prioriteit" ? function(r){return r.prioriteit;}
                  : state.groupBy==="status" ? function(r){return STATUS[r._status].label;}
                  : function(r){return r.entiteit;};
      var map = {};
      filtered.forEach(function(r){ var k=labelFn(r); (map[k]=map[k]||[]).push(r); });
      var keys = Object.keys(map);
      if(state.groupBy==="prioriteit") keys.sort(function(a,b){return (prioRank[a]==null?9:prioRank[a])-(prioRank[b]==null?9:prioRank[b]);});
      else if(state.groupBy==="status"){ var so={"Niet gestart":0,"Opgestart":1,"Afgerond":2}; keys.sort(function(a,b){return (so[a]==null?9:so[a])-(so[b]==null?9:so[b]);}); }
      else { var eo={"NV":0,"Gemeente":1,"GR":2,"GR / NV":3,"Keten":4}; keys.sort(function(a,b){return (eo[a]==null?9:eo[a])-(eo[b]==null?9:eo[b]);}); }
      groups = keys.map(function(k){ return { key:k, label:k, count:map[k].length, items:map[k] }; });
    }

    /* ---- build DOM ---- */
    var app = document.getElementById("app");
    app.textContent = "";

    /* header */
    app.appendChild(
      h("header",{class:"top"},
        h("div",{class:"wrap"},
          h("div",{class:"head-row"},[
            h("div",{style:{minWidth:"280px"}},[
              h("div",{class:"kicker"}, CFG.kicker || "Monitoring · Voortgangsbewaking"),
              h("span",{class:"kicker-line"}),
              h("h1",{class:"title"}, CFG.title || "Actieplan Managementletter 2025"),
              h("div",{class:"subtitle"}, CFG.subtitle || "")
            ]),
            h("div",{class:"head-right"},[
              h("div",{style:{textAlign:"right"}},[
                h("div",{class:"peil-label"},"Peildatum"),
                h("div",{class:"peil-value"}, fmtDateLong(peil))
              ]),
              h("div",{class:"ring", style:{ background:"conic-gradient("+ACCENT+" "+(pct*3.6)+"deg, rgba(255,255,255,.18) 0deg)" }},
                h("div",{class:"ring-inner"},[
                  h("span",{class:"ring-pct"}, pct+"%"),
                  h("span",{class:"ring-cap"},"KLAAR")
                ])
              )
            ])
          ])
        )
      )
    );

    var main = h("main",{}, h("div",{class:"wrap"}));
    var c = main.firstChild;

    /* edit banner */
    if(state.edit){
      var dc = draftCount();
      c.appendChild(
        h("div",{class:"banner banner-edit"},[
          h("div",{}, dc>0
            ? [h("b",{}, dc+(dc===1?" actie":" acties")+" gewijzigd. "), "Niet-geëxporteerde wijzigingen — lokaal in deze browser. Exporteer en commit data.js om ze online te delen."]
            : [h("b",{},"Bewerkmodus. "), "Wijzig statussen en notities; exporteer daarna data.js en commit dat bestand."]),
          h("div",{class:"banner-actions"},[
            h("button",{class:"btn btn-sm btn-accent", onclick:exportData},"Exporteer data.js"),
            dc>0 ? h("button",{class:"btn btn-sm", onclick:resetDraft},"Wijzigingen wissen") : null
          ])
        ])
      );
    }

    /* tiles */
    c.appendChild(
      h("section",{class:"tiles"},[
        tile(total, "Acties totaal", "#1a2024", function(){state.statusFilter="alle";state.overdueFilter=false;render();}, !state.overdueFilter&&state.statusFilter==="alle"),
        tile(cOpen, "Niet gestart", "#8a949b", function(){state.statusFilter="Open";state.overdueFilter=false;render();}, !state.overdueFilter&&state.statusFilter==="Open"),
        tile(cStart, "Opgestart", "#c4820f", function(){state.statusFilter="Opgestart";state.overdueFilter=false;render();}, !state.overdueFilter&&state.statusFilter==="Opgestart"),
        tile(cDone, "Afgerond", "#1f9d52", function(){state.statusFilter="Afgerond";state.overdueFilter=false;render();}, !state.overdueFilter&&state.statusFilter==="Afgerond"),
        tile(overdue, "Deadline verstreken", "#b42318", function(){state.overdueFilter=!state.overdueFilter;render();}, state.overdueFilter)
      ])
    );

    /* progress */
    c.appendChild(
      h("section",{class:"card progress-card"},[
        h("div",{class:"progress-head"},[
          h("span",{class:"progress-title"},"Voortgang afronding"),
          h("span",{class:"progress-sub"}, cDone+" van "+total+" afgerond · "+hoogOpen+" hoge prioriteit nog open")
        ]),
        h("div",{class:"bar"},[
          h("div",{style:{width:pct+"%", background:ACCENT}}),
          h("div",{style:{width:startPct+"%", background:"#e8a020"}})
        ])
      ])
    );

    /* toolbar */
    var search = h("input",{type:"text", value:state.search, placeholder:"Zoek op thema, owner, bron…"});
    search.addEventListener("input", function(e){ state.search=e.target.value; renderListOnly(); });
    var sortSel = selectEl(state.sort, [
      ["deadline","Sorteer: deadline"],["prioriteit","Sorteer: prioriteit"],
      ["status","Sorteer: status"],["id","Sorteer: nummer"]
    ], function(v){ state.sort=v; render(); });
    var groupSel = selectEl(state.groupBy, [
      ["geen","Groepeer: geen"],["status","Groepeer: status"],
      ["prioriteit","Groepeer: prioriteit"],["entiteit","Groepeer: entiteit"]
    ], function(v){ state.groupBy=v; render(); });

    c.appendChild(
      h("section",{class:"card toolbar"},[
        search,
        h("div",{class:"filter-group"},[
          h("span",{class:"filter-label"},"Status"),
          chip("Alle", state.statusFilter==="alle", function(){state.statusFilter="alle";render();}),
          chip("Niet gestart", state.statusFilter==="Open", function(){state.statusFilter="Open";render();}),
          chip("Opgestart", state.statusFilter==="Opgestart", function(){state.statusFilter="Opgestart";render();}),
          chip("Afgerond", state.statusFilter==="Afgerond", function(){state.statusFilter="Afgerond";render();})
        ]),
        h("div",{class:"filter-group"},[
          h("span",{class:"filter-label"},"Prioriteit"),
          chip("Alle", state.prioFilter==="alle", function(){state.prioFilter="alle";render();}),
          chip("Hoog", state.prioFilter==="Hoog", function(){state.prioFilter="Hoog";render();}),
          chip("Middel", state.prioFilter==="Middel", function(){state.prioFilter="Middel";render();})
        ]),
        sortSel, groupSel,
        h("button",{class:"btn", onclick:toggleAll}, state.allOpen?"Alles inklappen":"Alles uitklappen"),
        h("button",{class:"btn"+(state.edit?" btn-accent":""), onclick:function(){ state.edit=!state.edit; render(); }}, state.edit?"Klaar met bewerken":"Bewerken")
      ])
    );

    /* result line + list container */
    c.appendChild(h("div",{class:"result-line", id:"result-line"}, resultText(filtered.length,total)));
    var list = h("div",{id:"list"});
    c.appendChild(list);
    renderGroups(list, groups, today);

    /* footer */
    c.appendChild(
      h("footer",{class:"foot"},[
        "De getoonde status is de gepubliceerde, gedeelde stand uit ",
        h("code",{},"data.js"),
        ". Bewerken? Klik op ‘Bewerken’, pas aan en exporteer het bestand.",
        h("br",{}),
        "Concern voor Werk · Monitoring opvolging bevindingen accountant"
      ])
    );

    app.appendChild(main);
  }

  /* lightweight path that only re-renders list + result line (used while typing search) */
  function renderListOnly(){ render(); restoreSearchFocus(); }
  function restoreSearchFocus(){
    var inp = document.querySelector(".toolbar input[type=text]");
    if(inp){ inp.focus(); var v=inp.value; inp.value=""; inp.value=v; }
  }

  function resultText(n,total){
    return n + (n===1?" actie":" acties") + " getoond" + (n!==total ? (" van "+total) : "");
  }

  function tile(num, label, color, onClick, active){
    return h("div",{class:"tile"+(active?" active":""), onclick:onClick},[
      h("div",{class:"tile-num", style:{color:color}}, String(num)),
      h("div",{class:"tile-lbl"}, label)
    ]);
  }

  function selectEl(value, opts, onChange){
    var sel = h("select",{});
    opts.forEach(function(o){
      var opt = h("option",{value:o[0]}, o[1]);
      if(o[0]===value) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function(e){ onChange(e.target.value); });
    return sel;
  }

  function renderGroups(container, groups, today){
    var any = false;
    groups.forEach(function(g){
      if(!g.items.length) return;
      any = true;
      var box = h("div",{});
      if(state.groupBy!=="geen"){
        box.appendChild(
          h("div",{class:"group-head"},[
            h("span",{class:"group-title"}, g.label),
            h("span",{class:"group-count"}, String(g.count)),
            h("span",{class:"group-rule"})
          ])
        );
      }
      g.items.forEach(function(r){ box.appendChild(renderCard(r, today)); });
      container.appendChild(box);
    });
    if(!any){
      container.appendChild(h("div",{style:{textAlign:"center",padding:"60px 20px",color:"#9aa3a9",fontSize:"14px"}},"Geen acties gevonden voor deze filter."));
    }
  }

  function renderCard(r, today){
    var sc = STATUS[r._status], pc = PRIO[r.prioriteit] || PRIO.Laag;
    var expanded = !!state.expanded[r.id];
    var hasNote = !!(r.notitie && r.notitie.trim());

    /* status control: pill (read) or segmented buttons (edit) */
    var statusControl;
    if(state.edit){
      statusControl = h("div",{class:"seg"}, STATUS_ORDER.map(function(key){
        var sk = STATUS[key], on = r._status===key;
        var st = on
          ? { border:"1px solid "+sk.stripe, background:sk.bg, color:sk.txt, fontWeight:"700", boxShadow:"inset 0 0 0 1px "+sk.stripe }
          : {};
        return h("button",{ style:st, onclick:function(){ setStatus(r.id,key); } }, sk.label);
      }));
    } else {
      statusControl = h("div",{class:"status-pill", style:{ background:sc.bg, color:sc.txt }},[
        h("span",{class:"dot", style:{ background:sc.stripe }}),
        sc.label
      ]);
    }

    var docCount = linksOf(r).length;
    var aside = h("div",{class:"item-aside"},[
      statusControl,
      h("button",{class:"toggle", onclick:function(){ toggleExpand(r.id); }},[
        h("span",{}, expanded?"Verberg details":"Toon details"),
        docCount ? h("span",{class:"note-badge", style:{ color:"var(--navy)", background:"#e8eaef" }}, docCount+(docCount===1?" doc":" docs")) : null,
        hasNote ? h("span",{class:"note-badge", style:{ color:"#155e2e", background:"#e3f3e9" }}, "notitie") : null
      ])
    ]);

    var card = h("article",{class:"item", style:{ borderLeft:"4px solid "+sc.stripe }},[
      h("div",{class:"item-row"},[
        h("div",{class:"item-main"},[
          h("div",{class:"item-meta"},[
            h("span",{class:"item-id"}, r.id),
            h("span",{class:"badge", style:{ color:pc.txt, background:pc.bg }}, r.prioriteit),
            h("span",{class:"tag"}, r.entiteit),
            h("span",{class:"src"}, r.bron)
          ]),
          h("h3",{class:"item-title"}, r.thema),
          h("div",{class:"item-sub"},[
            h("span",{class:"owner"}, r.owner),
            h("span",{class:"deadline"},[
              h("b",{}, "Deadline "+r._dl.label),
              r._dl.note ? h("span",{class:"note", style:{ color:r._dl.color, background:r._dl.bg }}, r._dl.note) : null
            ])
          ])
        ]),
        aside
      ])
    ]);

    if(expanded) card.appendChild(renderDetails(r, hasNote));
    return card;
  }

  function renderDetails(r, hasNote){
    var grid = h("div",{class:"detail-grid"},[
      detailBlock("Bevinding", r.bevinding),
      detailBlock("Risico / impact", r.risico),
      detailBlock("Actie / aanbeveling", r.actie),
      detailBlock("Eerste stap", r.eersteStap),
      detailBlock("KPI / bewijs", r.kpi, true)
    ]);

    var details = h("div",{class:"details"},[grid]);

    /* progress note: editable in edit mode, read-only display otherwise */
    if(state.edit){
      var ta = h("textarea",{placeholder:"Voortgangsnotitie — wat is er gedaan, wat is de volgende stap?"});
      ta.value = r.notitie || "";
      ta.addEventListener("input", function(e){ setNote(r.id, e.target.value); updateNoteMeta(r.id); });
      details.appendChild(
        h("div",{class:"progress-note"},[
          h("div",{class:"detail-lbl"},"Voortgangsnotitie"),
          ta,
          h("div",{class:"note-meta", id:"note-meta-"+r.id}, r.bijgewerkt ? ("Laatst bijgewerkt: "+fmtDateLong(r.bijgewerkt)) : "Nog niet bijgewerkt")
        ])
      );
    } else if(hasNote || r.bijgewerkt){
      details.appendChild(
        h("div",{class:"progress-note"},[
          h("div",{class:"detail-lbl"},"Voortgang"),
          hasNote ? h("div",{class:"detail-val"}, r.notitie) : h("div",{class:"detail-val", style:{color:"#9aa3a9"}}, "Geen notitie."),
          r.bijgewerkt ? h("div",{class:"note-meta"}, "Laatst bijgewerkt: "+fmtDateLong(r.bijgewerkt)) : null
        ])
      );
    }

    var docsBlock = renderDocs(r);
    if(docsBlock) details.appendChild(docsBlock);

    return details;
  }

  function renderDocs(r){
    var links = linksOf(r);
    /* read-only: niets tonen als er geen documenten zijn */
    if(!state.edit && links.length === 0) return null;

    var rows = links.map(function(lk, i){
      var url = safeUrl(lk.url);
      var name = h("div",{class:"doc-name"}, lk.label || url || "(naamloos)");
      var left = url
        ? h("a",{ class:"doc-link", href:url, target:"_blank", rel:"noopener noreferrer" },[ docIcon(), name ])
        : h("div",{ class:"doc-link doc-link--dead", title:"Geen geldige https-link" },[ docIcon(), name ]);
      var right = state.edit
        ? h("button",{ class:"doc-remove", title:"Verwijderen", onclick:function(){ removeLink(r.id, r, i); } }, "×")
        : (url ? h("span",{class:"doc-open"}, "openen ↗") : h("span",{class:"doc-open doc-open--dead"}, "geen link"));
      return h("div",{class:"doc-row"},[ left, right ]);
    });

    var children = [
      h("div",{class:"detail-lbl"}, "Gekoppelde documenten"),
      links.length ? h("div",{class:"doc-list"}, rows) : null,
      (!links.length && state.edit) ? h("div",{class:"doc-empty"}, "Nog geen documenten gekoppeld.") : null
    ];

    if(state.edit){
      children.push(
        h("button",{ class:"btn btn-sm doc-add", onclick:function(){ addLink(r.id, r); } }, "+ Document koppelen")
      );
      children.push(
        h("div",{class:"doc-hint"}, "Plak een SharePoint- of weblink. De link komt in het (publieke) dashboard; het bestand zelf blijft beschermd door de SharePoint-rechten van je team.")
      );
    }
    return h("div",{class:"docs"}, children.filter(Boolean));
  }

  function docIcon(){
    /* eenvoudig document-icoon in lijnstijl (huisstijl: lijn-iconen) */
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("class","doc-ico");
    svg.setAttribute("width","15"); svg.setAttribute("height","15");
    var p = document.createElementNS(ns,"path");
    p.setAttribute("d","M14 3v5h5M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z");
    p.setAttribute("fill","none"); p.setAttribute("stroke","currentColor");
    p.setAttribute("stroke-width","1.6"); p.setAttribute("stroke-linejoin","round"); p.setAttribute("stroke-linecap","round");
    svg.appendChild(p);
    return svg;
  }

  function updateNoteMeta(id){
    var el = document.getElementById("note-meta-"+id);
    if(el){ var ov=state.draft[id]||{}; el.textContent = ov.bijgewerkt ? ("Laatst bijgewerkt: "+fmtDateLong(ov.bijgewerkt)) : "Nog niet bijgewerkt"; }
  }

  function detailBlock(label, value, span){
    return h("div", span?{class:"span-all"}:{},[
      h("div",{class:"detail-lbl"}, label),
      h("div",{class:"detail-val"}, value || "—")
    ]);
  }

  /* ---------- boot ---------- */
  if(!window.ACTIES){
    document.getElementById("app").appendChild(
      h("div",{style:{padding:"40px",fontFamily:"monospace",color:"#9a261d"}},"Fout: data.js kon niet geladen worden.")
    );
  } else {
    render();
  }
})();
</script>
</body>
</html>
