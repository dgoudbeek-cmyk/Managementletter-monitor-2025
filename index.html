  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const entryId = templateData.entry;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();

            'e.preventDefault();' +

              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +

      // root element. Scripts inserted via DOMParser/replaceWith are inert per

        // load/error, so awaiting would hang forever.

      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {

    }

    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).

    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      current = id;
      var gen = ++navGen;
      frame.onload = function() {

        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}

                     document.getElementById('__bundler_placeholder');

        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);

        else cw.scrollTo(0, 0);

  }

   <div style=\"font-size:11.5px;letter-spacing:.16em;font-weight:700;color:#6fbcae;text-transform:uppercase;margin-bottom:8px;\">Monitoring · Voortgangsbewaking<\u002Fdiv>\n        <h1 style=\"margin:0;font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.12;color:#fff;\">Actieplan Managementletter 2025<\u002Fh1>\n        <div style=\"margin-top:7px;font-size:14px;color:#a9cdc6;font-weight:500;\">Concern voor Werk · Opvolging bevindingen accountant<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;\">\n        <div style=\"text-align:right;\">\n          <div style=\"font-size:11.5px;letter-spacing:.12em;font-weight:700;color:#6fbcae;text-transform:uppercase;\">Peildatum<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:700;color:#fff;margin-top:3px;\">{{ peildatumLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ ringStyle }}\">\n          <div style=\"width:48px;height:48px;border-radius:50%;background:#0e3733;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n            <span style=\"font-size:16px;font-weight:800;color:#fff;line-height:1;\">{{ pctLabel }}<\u002Fspan>\n            <span style=\"font-size:8px;font-weight:700;color:#6fbcae;letter-spacing:.06em;margin-top:2px;\">KLAAR<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1180px;margin:0 auto;padding:24px 28px 72px;\">\n\n    <sc-if value=\"{{ quota }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fdeceb;border:1px solid #f3c9c6;color:#9a261d;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:500;margin-bottom:18px;\">Let op: de browseropslag is vol. Statuswijzigingen blijven zichtbaar, maar grote bestanden worden mogelijk niet bewaard na het verversen.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- STAT TILES -->\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px;\">\n      <div style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:15px 17px;\">\n        <div style=\"font-size:30px;font-weight:800;line-height:1;color:#1a2024;\">{{ total }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#6b757c;margin-top:7px;\">Acties totaal<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:15px 17px;\">\n        <div style=\"font-size:30px;font-weight:800;line-height:1;color:#8a949b;\">{{ cOpen }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#6b757c;margin-top:7px;\">Niet gestart<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:15px 17px;\">\n        <div style=\"font-size:30px;font-weight:800;line-height:1;color:#c4820f;\">{{ cStart }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#6b757c;margin-top:7px;\">Opgestart<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:15px 17px;\">\n        <div style=\"font-size:30px;font-weight:800;line-height:1;color:#1f9d52;\">{{ cDone }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#6b757c;margin-top:7px;\">Afgerond<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:15px 17px;\">\n        <div style=\"font-size:30px;font-weight:800;line-height:1;color:#b42318;\">{{ overdue }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:#6b757c;margin-top:7px;\">Deadline verstreken<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- PROGRESS BAR -->\n    <section style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:16px 18px;margin-bottom:16px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\">\n        <span style=\"font-size:13px;font-weight:700;color:#1a2024;\">Voortgang afronding<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#6b757c;\">{{ cDone }} van {{ total }} afgerond · {{ hoogOpen }} hoge prioriteit nog open<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:11px;background:#eceff0;border-radius:99px;overflow:hidden;display:flex;\">\n        <div style=\"{{ progressDoneStyle }}\"><\u002Fdiv>\n        <div style=\"{{ progressStartStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- TOOLBAR -->\n    <section style=\"background:#fff;border:1px solid #e6e9ea;border-radius:12px;padding:13px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;\">\n      <input type=\"text\" value=\"{{ search }}\" onchange=\"{{ onSearch }}\" placeholder=\"Zoek op thema, owner, bron…\" style=\"flex:1 1 220px;min-width:180px;padding:9px 13px;border:1px solid #dde1e3;border-radius:9px;font-size:13.5px;color:#1a2024;outline:none;background:#fafbfb;\">\n      <div style=\"display:flex;gap:6px;align-items:center;\">\n        <span style=\"font-size:11.5px;font-weight:700;color:#9aa3a9;text-transform:uppercase;letter-spacing:.05em;margin-right:2px;\">Status<\u002Fspan>\n        <sc-for list=\"{{ statusChips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ chip.set }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;align-items:center;\">\n        <span style=\"font-size:11.5px;font-weight:700;color:#9aa3a9;text-transform:uppercase;letter-spacing:.05em;margin-right:2px;\">Prioriteit<\u002Fspan>\n        <sc-for list=\"{{ prioChips }}\" as=\"chip\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ chip.set }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <select value=\"{{ sort }}\" onchange=\"{{ onSort }}\" style=\"padding:8px 11px;border:1px solid #dde1e3;border-radius:9px;font-size:13px;font-weight:600;color:#3a444b;background:#fafbfb;cursor:pointer;outline:none;\">\n        <option value=\"deadline\">Sorteer: deadline<\u002Foption>\n        <option value=\"prioriteit\">Sorteer: prioriteit<\u002Foption>\n        <option value=\"status\">Sorteer: status<\u002Foption>\n        <option value=\"id\">Sorteer: nummer<\u002Foption>\n      <\u002Fselect>\n      <button onclick=\"{{ onToggleAll }}\" style=\"padding:8px 13px;border:1px solid #dde1e3;border-radius:9px;font-size:13px;font-weight:600;color:#3a444b;background:#fff;cursor:pointer;\">{{ toggleAllLabel }}<\u002Fbutton>\n    <\u002Fsection>\n\n    <div style=\"font-size:12.5px;font-weight:600;color:#8a949b;margin:0 2px 12px;\">{{ resultLine }}<\u002Fdiv>\n\n    <!-- GROUPS / CARDS -->\n    <sc-for list=\"{{ groups }}\" as=\"group\" hint-placeholder-count=\"1\">\n      <div>\n        <sc-if value=\"{{ showGroupLabels }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin:22px 2px 12px;\">\n            <span style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0e3733;\">{{ group.label }}<\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:700;color:#9aa3a9;\">{{ group.count }}<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:#e2e6e7;\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"6\">\n          <article style=\"{{ item.cardStyle }}\">\n\n            <div style=\"display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;\">\n              <div style=\"flex:1 1 360px;min-width:240px;\">\n                <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;\">\n                  <span style=\"font-size:11px;font-weight:800;color:#9aa3a9;letter-spacing:.04em;\">{{ item.id }}<\u002Fspan>\n                  <span style=\"{{ item.prioBadgeStyle }}\">{{ item.prioriteit }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;color:#5f6a71;background:#eef1f2;border-radius:5px;padding:2px 8px;\">{{ item.entiteit }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;font-weight:600;color:#9aa3a9;\">{{ item.bron }}<\u002Fspan>\n                <\u002Fdiv>\n                <h3 style=\"margin:0 0 8px;font-size:17.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:#1a2024;\">{{ item.thema }}<\u002Fh3>\n                <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#6b757c;\">\n                  <span style=\"font-weight:500;\">{{ item.owner }}<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;\">\n                    <span style=\"font-weight:600;color:#3a444b;\">Deadline {{ item.deadlineLabel }}<\u002Fspan>\n                    <span style=\"{{ item.deadlineNoteStyle }}\">{{ item.deadlineNote }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:9px;flex:0 0 290px;min-width:240px;\">\n                <div style=\"display:flex;gap:6px;\">\n                  <button onclick=\"{{ item.setOpen }}\" style=\"{{ item.btnOpenStyle }}\">Niet gestart<\u002Fbutton>\n                  <button onclick=\"{{ item.setStart }}\" style=\"{{ item.btnStartStyle }}\">Opgestart<\u002Fbutton>\n                  <button onclick=\"{{ item.setDone }}\" style=\"{{ item.btnDoneStyle }}\">Afgerond<\u002Fbutton>\n                <\u002Fdiv>\n                <button onclick=\"{{ item.toggle }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;border:1px solid #e4e7ea;border-radius:8px;background:#fafbfb;font-size:12.5px;font-weight:600;color:#5f6a71;cursor:pointer;white-space:nowrap;\">\n                  <span>{{ item.toggleLabel }}<\u002Fspan>\n                  <span style=\"{{ item.fileBadgeStyle }}\">{{ item.fileBadgeLabel }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ item.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px;padding-top:16px;border-top:1px solid #eceff0;\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 24px;\">\n                  <div>\n                    <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#9aa3a9;margin-bottom:5px;\">Bevinding<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.5;color:#33404a;\">{{ item.bevinding }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#9aa3a9;margin-bottom:5px;\">Risico / impact<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.5;color:#33404a;\">{{ item.risico }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#9aa3a9;margin-bottom:5px;\">Actie / aanbeveling<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.5;color:#33404a;\">{{ item.actie }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#9aa3a9;margin-bottom:5px;\">Eerste stap<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.5;color:#33404a;\">{{ item.eersteStap }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"grid-column:1/-1;\">\n                    <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#9aa3a9;margin-bottom:5px;\">KPI / bewijs<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.5;color:#33404a;\">{{ item.kpi }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- FILES -->\n                <div ondrop=\"{{ item.onDrop }}\" ondragover=\"{{ item.onDragOver }}\" style=\"margin-top:16px;background:#fafbfb;border:1px dashed #d4dadd;border-radius:10px;padding:13px 15px;\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;\">\n                    <span style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5f6a71;\">Gekoppelde bestanden<\u002Fspan>\n                    <label style=\"{{ koppelBtnStyle }}\">\n                      + Bestand koppelen\n                      <input type=\"file\" multiple=\"\" onchange=\"{{ item.onPick }}\" style=\"display:none;\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ item.hasFiles }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                      <sc-for list=\"{{ item.files }}\" as=\"file\" hint-placeholder-count=\"0\">\n                        <div style=\"display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e6e9ea;border-radius:8px;padding:8px 11px;\">\n                          <span style=\"width:30px;height:30px;border-radius:7px;background:#e7f0ee;color:#0e6b60;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;\">{{ file.ext }}<\u002Fspan>\n                          <div style=\"flex:1;min-width:0;\">\n                            <div style=\"font-size:13px;font-weight:600;color:#26313a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ file.name }}<\u002Fdiv>\n                            <div style=\"font-size:11.5px;color:#9aa3a9;\">{{ file.sizeLabel }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ file.hasUrl }}\" hint-placeholder-val=\"{{ true }}\">\n                            <a href=\"{{ file.dataUrl }}\" download=\"{{ file.name }}\" style=\"font-size:12px;font-weight:700;color:#0e6b60;text-decoration:none;padding:5px 9px;border:1px solid #cfe3df;border-radius:7px;\">Download<\u002Fa>\n                          <\u002Fsc-if>\n                          <button onclick=\"{{ file.remove }}\" style=\"width:28px;height:28px;border:1px solid #ecdedd;border-radius:7px;background:#fff;color:#b4554d;font-size:16px;line-height:1;cursor:pointer;flex:0 0 auto;\">×<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ item.noFiles }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size:12.5px;color:#9aa3a9;\">Sleep bestanden hierheen of gebruik de knop hierboven om bewijsstukken te koppelen.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:60px 20px;color:#9aa3a9;font-size:14px;\">Geen acties gevonden voor deze filter.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <footer style=\"margin-top:28px;font-size:12px;color:#a3acb2;text-align:center;\">Statuswijzigingen en gekoppelde bestanden worden lokaal in deze browser bewaard.<\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n &quot;$preview&quot;: {&quot;width&quot;: 1180, &quot;height&quot;: 920},\n &quot;accentColor&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0f766e&quot;,&quot;tsType&quot;:&quot;string&quot;},\n &quot;groupBy&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;geen&quot;,&quot;status&quot;,&quot;prioriteit&quot;,&quot;entiteit&quot;],&quot;default&quot;:&quot;geen&quot;,&quot;tsType&quot;:&quot;string&quot;},\n &quot;peildatum&quot;: {&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-06-23&quot;,&quot;tsType&quot;:&quot;string&quot;}\n}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    const data = (typeof window!=='undefined' && window.ACTIES) ? window.ACTIES.map(d=>({...d})) : [];\n    this.data = data;\n    this.KEY = 'cvw-actieplan-v1';\n    this.state = {\n      store: this.load(data),\n      search:'', statusFilter:'alle', prioFilter:'alle', sort:'deadline',\n      expanded:{}, allOpen:false, quota:false,\n    };\n  }\n\n  componentDidMount(){ this._ensureData(0); }\n\n  _ensureData(tries){\n    if(this.data && this.data.length) return;\n    if(typeof window!=='undefined' && window.ACTIES && window.ACTIES.length){\n      this.data = window.ACTIES.map(d=>({...d}));\n      this.setState({ store:this.load(this.data) });\n      return;\n    }\n    if(tries<80){ setTimeout(()=>this._ensureData(tries+1), 50); }\n  }\n\n  load(data){\n    let saved={};\n    try{ saved = JSON.parse(localStorage.getItem(this.KEY)) || {}; }catch(e){}\n    const store={};\n    (data||[]).forEach(d=>{\n      const s = saved[d.id] || {};\n      store[d.id] = { status: s.status || d.status || 'Open', files: s.files || [], updatedAt: s.updatedAt || null };\n    });\n    return store;\n  }\n\n  persist(store){\n    try{ localStorage.setItem(this.KEY, JSON.stringify(store)); if(this.state.quota) this.setState({quota:false}); }\n    catch(e){ this.setState({quota:true}); }\n  }\n\n  setStatus(id, status){\n    this.setState(s=>{\n      const cur = s.store[id] || {status:'Open',files:[]};\n      const store = {...s.store, [id]:{...cur, status, updatedAt:Date.now()}};\n      this.persist(store); return {store};\n    });\n  }\n\n  toggleExpand(id){ this.setState(s=>({ expanded:{...s.expanded,[id]:!s.expanded[id]} })); }\n\n  toggleAll(){\n    this.setState(s=>{\n      const open = !s.allOpen; const e={};\n      (this.data||[]).forEach(d=>{ e[d.id]=open; });\n      return { expanded:e, allOpen:open };\n    });\n  }\n\n  addFiles(id, fileList){\n    const files=[...(fileList||[])]; if(!files.length) return;\n    Promise.all(files.map(f=>new Promise(res=>{\n      const meta={ name:f.name, size:f.size, type:f.type||'', added:Date.now() };\n      if(f.size > 4*1024*1024){ res({...meta, dataUrl:''}); return; }\n      const r=new FileReader();\n      r.onload=()=>res({...meta, dataUrl:r.result});\n      r.onerror=()=>res({...meta, dataUrl:''});\n      r.readAsDataURL(f);\n    }))).then(metas=>{\n      this.setState(s=>{\n        const cur = s.store[id] || {status:'Open',files:[]};\n        const store = {...s.store, [id]:{...cur, files:[...(cur.files||[]), ...metas], updatedAt:Date.now()}};\n        this.persist(store); return {store};\n      });\n    });\n  }\n\n  removeFile(id, idx){\n    this.setState(s=>{\n      const cur = s.store[id]; if(!cur) return {};\n      const fl = (cur.files||[]).slice(); fl.splice(idx,1);\n      const store = {...s.store, [id]:{...cur, files:fl, updatedAt:Date.now()}};\n      this.persist(store); return {store};\n    });\n  }\n\n  renderVals(){\n    const accent = this.props.accentColor || '#0f766e';\n    const groupBy = this.props.groupBy || 'geen';\n    const peil = this.props.peildatum || '2026-06-23';\n    const today = new Date(peil+'T00:00:00');\n\n    const STATUS = {\n      'Open':      { label:'Niet gestart', txt:'#7a858d', bg:'#f0f2f3', stripe:'#cdd4d9', bar:'#c4cbd0' },\n      'Opgestart': { label:'Opgestart',    txt:'#a9690a', bg:'#fdf1dc', stripe:'#e3ac4d', bar:'#e6ad3f' },\n      'Afgerond':  { label:'Afgerond',     txt:'#15803d', bg:'#e3f3e9', stripe:'#5fbd84', bar:'#28a55c' },\n    };\n    const PRIO = {\n      'Hoog':   { txt:'#b42318', bg:'#fdecea' },\n      'Middel': { txt:'#a8620a', bg:'#fbf0df' },\n      'Laag':   { txt:'#5f6a71', bg:'#eef1f2' },\n    };\n\n    const fmtDate = iso => { const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(iso||''); return m ? (m[3]+'-'+m[2]+'-'+m[1]) : (iso||''); };\n    const fmtSize = b => b<1024 ? b+' B' : b<1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB';\n    const extOf = n => { const p=(n||'').split('.'); return p.length>1 ? p.pop().slice(0,4).toUpperCase() : 'FILE'; };\n\n    const btnBase = { flex:'1 1 0', padding:'7px 4px', fontSize:'12px', borderRadius:'7px', cursor:'pointer', transition:'all .12s', textAlign:'center', whiteSpace:'nowrap', lineHeight:'1.1' };\n    const statusBtn = (status, key) => {\n      const c = STATUS[key];\n      return status===key\n        ? {...btnBase, border:'1px solid '+c.stripe, background:c.bg, color:c.txt, fontWeight:700, boxShadow:'inset 0 0 0 1px '+c.stripe}\n        : {...btnBase, border:'1px solid #e4e7ea', background:'#fbfcfc', color:'#9aa3a9', fontWeight:600};\n    };\n\n    const recs = (this.data||[]).map(d=>{\n      const st = this.state.store[d.id] || {status:'Open', files:[]};\n      const status = st.status;\n      const sc = STATUS[status] || STATUS.Open;\n      const pc = PRIO[d.prioriteit] || PRIO.Laag;\n\n      let deadlineLabel = fmtDate(d.deadline), deadlineNote='', overdue=false;\n      let noteColor='#9aa3a9', noteBg='transparent';\n      const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(d.deadline||'');\n      if(m && status!=='Afgerond'){\n        const dd=new Date(d.deadline+'T00:00:00');\n        const days=Math.round((dd-today)/86400000);\n        if(days<0){ deadlineNote=(-days)+' d. te laat'; noteColor='#b42318'; noteBg='#fdecea'; overdue=true; }\n        else if(days<=45){ deadlineNote='nog '+days+' d.'; noteColor='#a8620a'; noteBg='#fbf0df'; }\n        else { deadlineNote='nog '+days+' d.'; noteColor='#7a858d'; noteBg='#f0f2f3'; }\n      } else if(status==='Afgerond'){\n        deadlineNote='gereed'; noteColor='#15803d'; noteBg='#e3f3e9';\n      } else if(!m){\n        deadlineLabel = d.deadline;\n      }\n\n      const files = (st.files||[]).map((f,i)=>({\n        name:f.name, ext:extOf(f.name), sizeLabel:fmtSize(f.size||0),\n        dataUrl:f.dataUrl||'', hasUrl:!!f.dataUrl,\n        remove:()=>this.removeFile(d.id,i),\n      }));\n      const fc = files.length;\n\n      return {\n        ...d,\n        status, statusLabel:sc.label,\n        prioBadgeStyle:{ fontSize:'10.5px', fontWeight:800, letterSpacing:'.04em', textTransform:'uppercase', color:pc.txt, background:pc.bg, borderRadius:'5px', padding:'2px 8px' },\n        cardStyle:{ background:'#fff', border:'1px solid #e6e9ea', borderLeft:'4px solid '+sc.stripe, borderRadius:'12px', padding:'16px 18px', marginBottom:'12px' },\n        deadlineLabel, deadlineNote, overdue,\n        deadlineNoteStyle:{ fontSize:'11px', fontWeight:700, color:noteColor, background:noteBg, borderRadius:'5px', padding:'2px 7px', whiteSpace:'nowrap' },\n        btnOpenStyle: statusBtn(status,'Open'),\n        btnStartStyle: statusBtn(status,'Opgestart'),\n        btnDoneStyle: statusBtn(status,'Afgerond'),\n        expanded: !!this.state.expanded[d.id],\n        toggleLabel: this.state.expanded[d.id] ? 'Verberg details' : 'Toon details',\n        fileBadgeLabel: fc>0 ? (fc+(fc===1?' bestand':' bestanden')) : 'geen bestanden',\n        fileBadgeStyle:{ fontSize:'11px', fontWeight:700, color: fc>0?'#0e6b60':'#aab2b7', background: fc>0?'#e7f0ee':'#f0f2f3', borderRadius:'99px', padding:'2px 9px' },\n        files, hasFiles: fc>0, noFiles: fc===0,\n        setOpen:()=>this.setStatus(d.id,'Open'),\n        setStart:()=>this.setStatus(d.id,'Opgestart'),\n        setDone:()=>this.setStatus(d.id,'Afgerond'),\n        toggle:()=>this.toggleExpand(d.id),\n        onPick:(e)=>{ this.addFiles(d.id, e.target.files); e.target.value=''; },\n        onDrop:(e)=>{ e.preventDefault(); this.addFiles(d.id, e.dataTransfer.files); },\n        onDragOver:(e)=>e.preventDefault(),\n      };\n    });\n\n    // stats\n    const total = recs.length;\n    const cOpen = recs.filter(r=>r.status==='Open').length;\n    const cStart = recs.filter(r=>r.status==='Opgestart').length;\n    const cDone = recs.filter(r=>r.status==='Afgerond').length;\n    const overdue = recs.filter(r=>r.overdue).length;\n    const hoogOpen = recs.filter(r=>r.prioriteit==='Hoog' && r.status!=='Afgerond').length;\n    const pct = total ? Math.round(cDone/total*100) : 0;\n    const startPct = total ? Math.round(cStart/total*100) : 0;\n\n    // filtering\n    const q = this.state.search.trim().toLowerCase();\n    const sf = this.state.statusFilter, pf = this.state.prioFilter;\n    let filtered = recs.filter(r=>{\n      if(sf!=='alle' && r.status!==sf) return false;\n      if(pf!=='alle' && r.prioriteit!==pf) return false;\n      if(q){ const hay=(r.id+' '+r.thema+' '+r.owner+' '+r.bevinding+' '+r.actie+' '+r.bron+' '+r.entiteit).toLowerCase(); if(!hay.includes(q)) return false; }\n      return true;\n    });\n\n    // sorting\n    const prioRank={Hoog:0,Middel:1,Laag:2};\n    const statusRank={Open:0,Opgestart:1,Afgerond:2};\n    const dlVal=r=>{ const m=/^(\\d{2})-(\\d{2})-(\\d{4})$/.exec(r.deadlineLabel); return m?Number(m[3]+m[2]+m[1]):99999999; };\n    const sorters={\n      deadline:(a,b)=>dlVal(a)-dlVal(b) || a.id.localeCompare(b.id),\n      prioriteit:(a,b)=>prioRank[a.prioriteit]-prioRank[b.prioriteit] || dlVal(a)-dlVal(b),\n      status:(a,b)=>statusRank[a.status]-statusRank[b.status] || dlVal(a)-dlVal(b),\n      id:(a,b)=>a.id.localeCompare(b.id),\n    };\n    filtered = filtered.slice().sort(sorters[this.state.sort]||sorters.deadline);\n\n    // grouping\n    let groups;\n    if(groupBy==='geen'){\n      groups=[{key:'all', label:'', count:filtered.length, items:filtered}];\n    } else {\n      const labelFn = groupBy==='prioriteit' ? (r=>r.prioriteit)\n                    : groupBy==='status' ? (r=>r.statusLabel)\n                    : (r=>r.entiteit);\n      const map=new Map();\n      filtered.forEach(r=>{ const k=labelFn(r); if(!map.has(k)) map.set(k,[]); map.get(k).push(r); });\n      let keys=[...map.keys()];\n      if(groupBy==='prioriteit') keys.sort((a,b)=>(prioRank[a]??9)-(prioRank[b]??9));\n      else if(groupBy==='status'){ const o={'Niet gestart':0,'Opgestart':1,'Afgerond':2}; keys.sort((a,b)=>(o[a]??9)-(o[b]??9)); }\n      else { const o={'NV':0,'Gemeente':1,'GR':2,'GR / NV':3,'Keten':4}; keys.sort((a,b)=>(o[a]??9)-(o[b]??9)); }\n      groups=keys.map(k=>({key:k, label:k, count:map.get(k).length, items:map.get(k)}));\n    }\n\n    // filter chips\n    const chipBase={ padding:'6px 11px', borderRadius:'8px', fontSize:'12.5px', fontWeight:600, cursor:'pointer', border:'1px solid #e1e5e7', background:'#fff', color:'#5f6a71' };\n    const chipOn={ ...chipBase, border:'1px solid '+accent, background:accent, color:'#fff' };\n    const mkChips=(opts, current, setter)=> opts.map(o=>({ label:o.label, set:()=>this.setState(setter(o.val)), style: current===o.val ? chipOn : chipBase }));\n    const statusChips = mkChips(\n      [{val:'alle',label:'Alle'},{val:'Open',label:'Niet gestart'},{val:'Opgestart',label:'Opgestart'},{val:'Afgerond',label:'Afgerond'}],\n      sf, v=>({statusFilter:v}));\n    const prioChips = mkChips(\n      [{val:'alle',label:'Alle'},{val:'Hoog',label:'Hoog'},{val:'Middel',label:'Middel'}],\n      pf, v=>({prioFilter:v}));\n\n    const fmtDate2 = iso => { const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(iso||''); const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec']; return m ? (Number(m[3])+' '+mn[Number(m[2])-1]+' '+m[1]) : iso; };\n\n    return {\n      peildatumLabel: fmtDate2(peil),\n      pctLabel: pct+'%',\n      ringStyle:{ width:'64px', height:'64px', borderRadius:'50%', background:'conic-gradient('+accent+' '+(pct*3.6)+'deg, rgba(255,255,255,.16) 0deg)', display:'flex', alignItems:'center', justifyContent:'center', flex:'0 0 auto' },\n      total, cOpen, cStart, cDone, overdue, hoogOpen,\n      progressDoneStyle:{ width:pct+'%', background:accent, height:'100%', transition:'width .3s' },\n      progressStartStyle:{ width:startPct+'%', background:'#e6ad3f', height:'100%', transition:'width .3s' },\n      search:this.state.search,\n      onSearch:(e)=>this.setState({search:e.target.value}),\n      sort:this.state.sort,\n      onSort:(e)=>this.setState({sort:e.target.value}),\n      onToggleAll:()=>this.toggleAll(),\n      toggleAllLabel: this.state.allOpen ? 'Alles inklappen' : 'Alles uitklappen',\n      statusChips, prioChips,\n      groups, showGroupLabels: groupBy!=='geen',\n      showEmpty: filtered.length===0,\n      resultLine: filtered.length+(filtered.length===1?' actie':' acties')+' getoond' + (filtered.length!==total ? (' van '+total) : ''),\n      quota:this.state.quota,\n      koppelBtnStyle:{ fontSize:'12px', fontWeight:700, color:accent, background:'#fff', border:'1px solid '+accent, borderRadius:'8px', padding:'6px 12px', cursor:'pointer', whiteSpace:'nowrap' },\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"_standalone_src.dc"}
